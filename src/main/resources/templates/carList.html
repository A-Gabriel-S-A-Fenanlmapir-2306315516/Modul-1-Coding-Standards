<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Car List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
</head>
<body>
<div class="container my-4">
    <h2>Car List</h2>
    <a th:href="@{/car/createCar}" class="btn btn-primary btn-sm mb-3">Create Car</a>
    <a th:href="@{/}" class="btn btn-secondary btn-sm mb-3">Home</a>

    <table class="table table-striped table-responsive-md">
        <thead>
        <tr>
            <th scope="col">Id</th>
            <th scope="col">Car Name</th>
            <th scope="col">Color</th>
            <th scope="col">Quantity</th>
            <th scope="col">Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="car : ${cars}">
            <td th:text="${car.carId != null ? car.carId.substring(0, 8) : 'N/A'}"></td>
            <td th:text="${car.carName}"></td>
            <td th:text="${car.carColor}"></td>
            <td th:text="${car.carQuantity}"></td>
            <td>
                <a th:href="@{/car/editCar/{id}(id=${car.carId})}" class="btn btn-sm btn-warning">Edit</a>
                <form th:action="@{/car/deleteCar}" method="post" class="d-inline">
                    <input type="hidden" name="carId" th:value="${car.carId}">
                    <button type="submit" class="btn btn-sm btn-danger">Delete</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
