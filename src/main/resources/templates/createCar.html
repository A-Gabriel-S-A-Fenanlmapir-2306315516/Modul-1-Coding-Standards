<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create New Car</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
</head>
<body>
<div class="container mt-5">
    <div class="row">
        <div class="col-md-6">
            <h3>Create New Car</h3>
            <hr>

            <form th:action="@{/car/createCar}" th:object="${car}" method="post">
                <div class="mb-3">
                    <label for="nameInput" class="form-label">Car Name</label>
                    <input th:field="*{carName}" type="text" class="form-control" id="nameInput" placeholder="Enter car name" required>
                </div>

                <div class="mb-3">
                    <label for="colorInput" class="form-label">Car Color</label>
                    <input th:field="*{carColor}" type="text" class="form-control" id="colorInput" placeholder="Enter car color" required>
                </div>

                <div class="mb-3">
                    <label for="quantityInput" class="form-label">Quantity</label>
                    <input th:field="*{carQuantity}" type="number" class="form-control" id="quantityInput" placeholder="Enter car quantity" required>
                </div>

                <button type="submit" class="btn btn-primary">Submit</button>
                <a th:href="@{/car/listCar}" class="btn btn-secondary">Back</a>
            </form>
        </div>
    </div>
</div>
</body>
</html>
